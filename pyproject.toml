[build-system]
requires = ['setuptools >= 61.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'pixutils'
version = '0.4'
dependencies = []
requires-python = '>=3.10'
authors = [
  { name = 'Tomi Valkeinen', email = 'tomi.valkeinen@ideasonboard.com' },
]
maintainers = [
  { name = 'Tomi Valkeinen', email = 'tomi.valkeinen@ideasonboard.com' },
]
description = 'Python pixutils'
readme = 'README.md'
license = { file = 'LICENSE.md' }
keywords = ['linux', 'kms', 'drm', 'v4l2']
classifiers = [
  'Programming Language :: Python',
  'License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)',
  'Development Status :: 4 - Beta',
  'Operating System :: POSIX :: Linux',
]

[project.urls]
Homepage = 'https://github.com/tomba/pixutils'
Repository = 'https://github.com/tomba/pixutils.git'
'Bug Tracker' = 'https://github.com/tomba/pixutils/issues'

[project.optional-dependencies]
conv = ['numpy', 'numba', 'opencv-python']
pixpat = ['pixpat @ git+https://github.com/tomba/pixpat.git@v1.1']
qt = ['PyQt6', 'pyqtgraph']
png = ['Pillow']
test = ['pytest']
all = ['pixutils[conv,pixpat,png,qt,test]']

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
  'E',   # pycodestyle errors
  'W',   # pycodestyle warnings
  'F',   # Pyflakes: undefined/unused names, bad imports, f-string mistakes
  'FA',  # flake8-future-annotations: require `from __future__ import annotations`
  'Q',   # flake8-quotes: quote style, configured under lint.flake8-quotes below
  'UP',  # pyupgrade: rewrite idioms obsolete for our minimum Python
  'PLE', # Pylint errors: things that are outright broken
  'PLW', # Pylint warnings: suspicious but legal constructs
]
ignore = [
  'E501',  # line-too-long
  'UP032', # f-string: rewrite `'{}'.format(x)` as an f-string
]

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['F401', 'F403']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'double' # only 'double' is compatible with the formatter

[tool.ruff.format]
quote-style = 'single'
